name: Deploy docs on gh-pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    name: Build and deploy docs
    steps:
      # mike reads and rewrites the gh-pages branch, so it needs the full
      # history and a token that can push.
      - uses: actions/checkout@v4
        name: Checkout repository
        with:
          fetch-depth: 0
          token: ${{ secrets.GHPAGES_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Configure git for mike
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "git@github.com"

      # Docs are versioned: each release keeps its own copy under /<major.minor>/
      # and the theme shows a version selector. `latest` always aliases the
      # newest deploy, so existing links keep working.
      - name: Read the version being documented
        run: |
          VERSION=$(uv run --no-sync python -c \
            "import jax_unirep; print('.'.join(jax_unirep.__version__.split('.')[:2]))")
          echo "docs_version=$VERSION" >> $GITHUB_ENV

      - name: Deploy versioned docs
        run: |
          uv run --no-sync mike deploy --push --update-aliases \
            "${{ env.docs_version }}" latest
          uv run --no-sync mike set-default --push latest
