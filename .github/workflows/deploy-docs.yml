name: Deploy docs on gh-pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    name: Build and deploy docs
    steps:
      - uses: actions/checkout@v4
        name: Checkout repository

      - uses: astral-sh/setup-uv@v5
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      # docs/fitting.ipynb declares a kernel named "jax-unirep",
      # and mknotebooks executes it at build time.
      - name: Register notebook kernel
        run: uv run --no-sync python -m ipykernel install --user --name jax-unirep

      - name: Build docs
        run: uv run --no-sync mkdocs build

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          # https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-set-personal-access-token-personal_token
          personal_token: ${{ secrets.GHPAGES_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          allow_empty_commit: false
          keep_files: false
          force_orphan: true
          enable_jekyll: false
          disable_nojekyll: false
