name: Deploy docs on gh-pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    name: Build and deploy docs
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Build docs
        run: uv run --no-sync mkdocs build --strict

      # Single-version docs, deliberately. Older releases are not republished:
      # their sources live in the git tags as readable markdown, e.g.
      # `git show v2.2.0:docs/advanced.md`. Versioned hosting (mike) would add
      # a selector, a versions.json and a permanent URL-layout change for a
      # audience that can read the tag directly.
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GHPAGES_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          allow_empty_commit: false
          keep_files: false
          force_orphan: true
          enable_jekyll: false
          disable_nojekyll: false
