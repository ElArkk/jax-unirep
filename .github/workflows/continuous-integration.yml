name: JAX-UniRep CI pipeline

on: [pull_request]

jobs:
  # Code style checks.
  # These only need black, so we skip installing the package entirely
  # and get feedback on style issues within seconds.
  code-style:
    runs-on: ubuntu-latest
    name: Code style checks
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install black
        run: uv pip install black

      - name: Run black
        run: uv run --no-sync make style

  run-tests:
    runs-on: ubuntu-latest
    name: Run tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      # One job for the whole suite. There is no fast/slow split: the two
      # tests that used to be marked slow take under 5s, most of which is
      # interpreter and JAX import paid once regardless, so splitting cost a
      # second runner and a second coverage upload for no wall-clock gain.
      - name: Run tests
        run: >
          uv run --no-sync pytest
          --cov=jax_unirep --cov-report term-missing --cov-report xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: python

  build-docs:
    runs-on: ubuntu-latest
    name: Build docs
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Build docs
        run: uv run --no-sync mkdocs build
