name: JAX-UniRep CI pipeline

on: [pull_request]

jobs:
  # Code style checks.
  # These only need black, so we skip installing the package entirely
  # and get feedback on style issues within seconds.
  code-style:
    runs-on: ubuntu-latest
    name: Code style checks
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install black
        run: uv pip install black

      - name: Run black
        run: uv run --no-sync make style

  run-fast-tests:
    runs-on: ubuntu-latest
    name: Run fast tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run fast tests
        run: >
          uv run --no-sync pytest -m "not slow"
          --cov=jax_unirep --cov-report term-missing --cov-report xml

      # No token: the Codecov org has token authentication disabled for
      # public repositories, which is their default for new orgs. Passing an
      # empty secret is not the same as passing none, so the input is omitted
      # rather than left referencing a secret that does not exist.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: python

  run-slow-tests:
    runs-on: ubuntu-latest
    name: Run slow tests
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run slow tests
        run: >
          uv run --no-sync pytest -m "slow"
          --cov=jax_unirep --cov-report term-missing --cov-report xml

      # No token: the Codecov org has token authentication disabled for
      # public repositories, which is their default for new orgs. Passing an
      # empty secret is not the same as passing none, so the input is omitted
      # rather than left referencing a secret that does not exist.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: python

  build-docs:
    runs-on: ubuntu-latest
    name: Build docs
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Build docs
        run: uv run --no-sync mkdocs build
