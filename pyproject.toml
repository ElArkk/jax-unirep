[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "jax_unirep"
description = "A performant and user-friendly reimplementation of UniRep in JAX."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Arkadij Kummer", email = "arkadij.kummer@gmail.com" },
  { name = "Eric J. Ma", email = "ericmajinglong@gmail.com" },
  { name = "Ivan Jayapurna", email = "ivanfj@berkeley.edu" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "jax>=0.4",
  "jaxlib>=0.4",
  "equinox>=0.11",
  "optax>=0.2",
  "multipledispatch",
  "numpy",
  "optuna>=3",
  "scikit-learn",
  "tqdm",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  # Tests
  "pytest",
  "pytest-cov",
  "hypothesis",
  # Code style
  "black",
  "isort",
  "pre-commit",
  # Docs.
  "mkdocs",
  "mkdocs-material",
  "mkautodoc",
  # Used by examples/draft_cli.py
  "pyprojroot",
]

[project.urls]
Homepage = "https://github.com/ElArkk/jax-unirep"

[tool.setuptools]
include-package-data = true
packages = ["jax_unirep"]

[tool.setuptools.dynamic]
version = { attr = "jax_unirep.version.__version__" }

[tool.setuptools.package-data]
jax_unirep = ["weights/uniref50/*/*.npz"]

# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
[tool.black]
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''
include = '\.pyi?$'
line-length = 79
target-version = ['py310', 'py311', 'py312']

[tool.isort]
float_to_top = true
line_length = 79
profile = "black"
src_paths = ["jax_unirep", "test"]

