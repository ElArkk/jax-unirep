# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # docs/fitting.ipynb declares a kernel named "jax-unirep",
    # and mknotebooks executes it at build time.
    post_install:
      - python -m ipykernel install --user --name jax-unirep

# Build documentation with MkDocs
mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
